name: ADK-only Claude consumer
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deterministic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # exact pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # exact pinned
        with:
          python-version: '3.12'
      - name: Syntax
        run: bash -n control/scripts/install.sh control/scripts/doctor.sh control/scripts/runtime-r2-local.sh
      - name: Source and copy safety regression
        run: python -m unittest discover -s tests -p 'test_adk_only.py' -v
