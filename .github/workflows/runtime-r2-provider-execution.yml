name: Claude R2 Provider Execution

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_REAL_R2 to authorize Claude provider execution only"
        required: true
        type: string
      digital_worker_commit:
        description: "Exact Digital Worker commit that defines the frozen R2 plan"
        required: true
        type: string
      frozen_inputs_sha256:
        description: "Expected frozen controlled-task SHA-256 produced by Digital Worker"
        required: true
        type: string
      target_repository:
        description: "Frozen target repository"
        required: true
        default: "jiying2007/ota_download_test"
        type: string
      target_base_commit:
        description: "Exact frozen target base commit"
        required: true
        default: "eeb926bd1fff75d2a5d5abb9f0ede9c8f582cc6d"
        type: string
      provider_identity:
        description: "Auditable provider identity behind the Claude runtime transport"
        required: true
        default: "anthropic"
        type: string

permissions:
  contents: read

concurrency:
  group: claude-r2-provider-${{ github.run_id }}
  cancel-in-progress: false

env:
  CLAUDE_BINDING_COMMIT: fba4551aa4a2abe5f74cff3c60e8318961b36add
  ADK_CONTRACT_COMMIT: 1d6c28e89eb98a4af5ac978707730783f0c84437
  ADK_RELEASE_COMMIT: 1d6c28e89eb98a4af5ac978707730783f0c84437

jobs:
  execute:
    name: Execute Claude and attest native evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Enforce explicit runtime-owned authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          DIGITAL_WORKER_COMMIT: ${{ inputs.digital_worker_commit }}
          FROZEN_INPUTS_SHA256: ${{ inputs.frozen_inputs_sha256 }}
          TARGET_BASE_COMMIT: ${{ inputs.target_base_commit }}
          CLAUDE_RUNTIME_CREDENTIAL: ${{ secrets.CLAUDE_RUNTIME_CREDENTIAL }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$CONFIRMATION" = RUN_REAL_R2
          [[ "$DIGITAL_WORKER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FROZEN_INPUTS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TARGET_BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [ -z "$CLAUDE_RUNTIME_CREDENTIAL" ]; then
            echo '::error::BLOCKED_MISSING_CLAUDE_RUNTIME_CREDENTIAL'
            exit 2
          fi

      - name: Checkout exact Digital Worker governance source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiying2007/digital-worker
          ref: ${{ inputs.digital_worker_commit }}
          path: digital-worker
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact frozen target base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_base_commit }}
          path: r2-target
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact Claude runtime binding
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiying2007/claude
          ref: fba4551aa4a2abe5f74cff3c60e8318961b36add
          path: claude-binding
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact ADK consumer contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiying2007/agent-dev-kit
          ref: 1d6c28e89eb98a4af5ac978707730783f0c84437
          path: adk-contract
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout immutable ADK v7.0.4 release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jiying2007/agent-dev-kit
          ref: 1d6c28e89eb98a4af5ac978707730783f0c84437
          path: adk-release
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install exact validator dependency
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'

      - name: Recompute and verify the canonical frozen plan
        env:
          DIGITAL_WORKER_COMMIT: ${{ inputs.digital_worker_commit }}
          EXPECTED_FROZEN_INPUTS_SHA256: ${{ inputs.frozen_inputs_sha256 }}
          TARGET_BASE_COMMIT: ${{ inputs.target_base_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C digital-worker rev-parse HEAD)" = "$DIGITAL_WORKER_COMMIT"
          test "$(git -C r2-target rev-parse HEAD)" = "$TARGET_BASE_COMMIT"
          test -z "$(git -C r2-target status --porcelain=v1 --untracked-files=all)"
          python digital-worker/scripts/runtime_r2_evidence.py prepare \
            --root "$GITHUB_WORKSPACE/digital-worker" \
            --target-root "$GITHUB_WORKSPACE/r2-target" \
            --output "$RUNNER_TEMP/frozen-plan.json"
          python - "$RUNNER_TEMP/frozen-plan.json" <<'PY'
          import json, os, pathlib
          plan=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'frozen-plan.json').read_text())
          assert plan['schema'] == 'digital-worker-runtime-r2-plan/v1'
          assert plan['frozen_inputs_sha256'] == os.environ['EXPECTED_FROZEN_INPUTS_SHA256']
          assert plan['controlled_task']['exact_base_commit'] == os.environ['TARGET_BASE_COMMIT']
          binding=plan['runtime_bindings']['claude-code']
          assert binding['repository'] == 'jiying2007/claude'
          assert binding['commit'] == os.environ['CLAUDE_BINDING_COMMIT']
          assert binding['runtime_target'] == 'claude-code'
          assert plan['adk_release_identity']['commit'] == os.environ['ADK_RELEASE_COMMIT']
          PY

      - name: Materialize exact Claude source set into isolated user scope
        shell: bash
        run: |
          set -euo pipefail
          git -C adk-release fetch --quiet origin refs/tags/v7.0.4:refs/tags/v7.0.4
          test "$(git -C adk-contract rev-parse HEAD)" = "$ADK_CONTRACT_COMMIT"
          test "$(git -C adk-release rev-parse HEAD)" = "$ADK_RELEASE_COMMIT"
          python claude-binding/control/scripts/dw_runtime.py materialize \
            --adk-contract-root "$GITHUB_WORKSPACE/adk-contract" \
            --adk-release-root "$GITHUB_WORKSPACE/adk-release" \
            --out "$RUNNER_TEMP/claude-materialized" \
            --runtime-profile solo-dev
          mkdir -p "$RUNNER_TEMP/claude-home/.claude"
          cp -a "$RUNNER_TEMP/claude-materialized/distribution/." "$RUNNER_TEMP/claude-home/.claude/"
          python - "$RUNNER_TEMP/claude-materialized/runtime-distribution.json" "$RUNNER_TEMP/claude-home/.claude" <<'PY'
          import hashlib, json, pathlib, sys
          manifest=json.loads(pathlib.Path(sys.argv[1]).read_text()); root=pathlib.Path(sys.argv[2])
          for item in manifest['files']:
              path=root/item['path']
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=item['sha256']:
                  raise SystemExit('installed Claude asset identity mismatch: '+item['path'])
          PY

      - name: Create runtime-local provider authorization receipt
        env:
          EXPECTED_FROZEN_INPUTS_SHA256: ${{ inputs.frozen_inputs_sha256 }}
          DIGITAL_WORKER_COMMIT: ${{ inputs.digital_worker_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/frozen-plan.json" "$RUNNER_TEMP/provider-authorization.json" <<'PY'
          import hashlib, json, os, pathlib, sys
          plan_path,out=map(pathlib.Path,sys.argv[1:]); plan=json.loads(plan_path.read_text())
          value={
              'schema':'claude-r2-provider-authorization/v1','authorized':True,
              'authorization_mode':'explicit-runtime-owned-workflow-dispatch','actor':os.environ['GITHUB_ACTOR'],
              'workflow_run_id':os.environ['GITHUB_RUN_ID'],'workflow_sha':os.environ['GITHUB_SHA'],
              'digital_worker_commit':os.environ['DIGITAL_WORKER_COMMIT'],
              'frozen_plan_sha256':hashlib.sha256(plan_path.read_bytes()).hexdigest(),
              'frozen_inputs_sha256':plan['frozen_inputs_sha256'],'scope':'claude-provider-execution-only',
              'verification_or_release_authority':False,
          }
          assert value['frozen_inputs_sha256']==os.environ['EXPECTED_FROZEN_INPUTS_SHA256']
          out.write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/claude-started-at"

      - name: Read frozen provider prompt
        id: frozen-prompt
        shell: bash
        run: |
          {
            echo 'text<<R2_PROMPT_EOF'
            python - "$RUNNER_TEMP/frozen-plan.json" <<'PY'
          import json, os, pathlib
          print(json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'frozen-plan.json').read_text())['prompt'])
          PY
            echo 'R2_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude through the runtime-owned execution adapter
        id: provider
        uses: anthropics/claude-code-action/base-action@3b8197d3d486006dd4af54613517f21ac6ac625e
        env:
          HOME: ${{ runner.temp }}/claude-home
          CLAUDE_WORKING_DIR: ${{ github.workspace }}/r2-target
          ANTHROPIC_BASE_URL: ${{ vars.CLAUDE_RUNTIME_ENDPOINT }}
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_RUNTIME_CREDENTIAL }}
          prompt: ${{ steps.frozen-prompt.outputs.text }}
          show_full_output: 'false'
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(python *),Bash(python3 *),Bash(pytest *),Bash(sha256sum *),Bash(git status*),Bash(git diff*),Bash(git rev-parse*),Bash(ls *),Bash(find *)"

      - name: Build native execution receipt and replay-complete result bundle
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          PROVIDER_IDENTITY: ${{ inputs.provider_identity }}
          CLAUDE_EXECUTION_FILE: ${{ steps.provider.outputs.execution_file }}
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/claude-finished-at"
          "$RUNNER_TEMP/claude-home/.local/bin/claude" --version > "$RUNNER_TEMP/claude-version.txt"
          test -n "$CLAUDE_EXECUTION_FILE" && test -f "$CLAUDE_EXECUTION_FILE"
          git -C r2-target status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/claude-status.txt"
          git -C r2-target diff --binary > "$RUNNER_TEMP/claude.patch"
          tar --exclude=.git -C r2-target -czf "$RUNNER_TEMP/result-tree.tar.gz" .
          python - "$RUNNER_TEMP/frozen-plan.json" "$RUNNER_TEMP/provider-authorization.json" "$RUNNER_TEMP/claude-materialized/source-set.json" "$RUNNER_TEMP/claude-materialized/runtime-distribution.json" "$GITHUB_WORKSPACE/r2-target" "$CLAUDE_EXECUTION_FILE" "$RUNNER_TEMP/result-tree.tar.gz" "$RUNNER_TEMP/claude-native.json" <<'PY'
          import hashlib, json, os, pathlib, sys
          plan_path,auth_path,source_path,distribution_path,target,execution_file,result_archive,out=map(pathlib.Path,sys.argv[1:])
          plan=json.loads(plan_path.read_text()); auth=json.loads(auth_path.read_text())
          source=json.loads(source_path.read_text()); distribution=json.loads(distribution_path.read_text())
          assert auth['authorized'] is True and auth['frozen_inputs_sha256']==plan['frozen_inputs_sha256']
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          def tree_digest(root):
              rows=[]
              for p in sorted(x for x in root.rglob('*') if x.is_file() and '.git' not in x.parts):
                  rows.append((p.relative_to(root).as_posix(),sha(p)))
              return hashlib.sha256(json.dumps(rows,separators=(',',':')).encode()).hexdigest()
          controlled=plan['controlled_task']; version=pathlib.Path(os.environ['RUNNER_TEMP'],'claude-version.txt').read_text().strip()
          result_identity=hashlib.sha256((sha(execution_file)+tree_digest(target)+sha(result_archive)).encode()).hexdigest()
          receipt={
              'schema_version':2,'status':'completed','runtime':'claude-code','frozen_inputs_sha256':plan['frozen_inputs_sha256'],
              'verification_pass_claimed':False,
              'runtime_identity':{
                  'runtime_binding_repository':'jiying2007/claude','runtime_binding_commit':os.environ['CLAUDE_BINDING_COMMIT'],
                  'runtime_target':'claude-code','runtime_profile':'solo-dev','runtime_host':'github-actions:'+os.environ['GITHUB_RUN_ID'],
                  'runtime_provider':os.environ['PROVIDER_IDENTITY'],'runtime_version':version,
                  'runtime_source_set_identity_ref':source['identity'],'runtime_distribution_identity_ref':distribution['identity'],
              },
              'execution':{
                  'started_at':pathlib.Path(os.environ['RUNNER_TEMP'],'claude-started-at').read_text().strip(),
                  'completed_at':pathlib.Path(os.environ['RUNNER_TEMP'],'claude-finished-at').read_text().strip(),
                  'result_identity_ref':'sha256:'+result_identity,'source_identity_ref':controlled['runtime_source_set_identity_ref'],
                  'exit_code':0,'summary':'Real Claude runtime execution in the Claude-owned execution domain; no Verification PASS claim.',
              },
              'evidence_refs':[
                  'provider-authorization:sha256:'+sha(auth_path),'claude-execution-file:sha256:'+sha(execution_file),
                  'worktree-result:sha256:'+tree_digest(target),'replay-result-archive:sha256:'+sha(result_archive),
              ],
          }
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          python claude-binding/control/scripts/dw_runtime.py receipt \
            --input "$RUNNER_TEMP/claude-native.json" \
            --output "$RUNNER_TEMP/claude-native-validated.json"

      - name: Assemble immutable evidence subject
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/claude-r2-evidence"
          mkdir -p "$evidence"
          cp "$RUNNER_TEMP/frozen-plan.json" "$evidence/"
          cp "$RUNNER_TEMP/provider-authorization.json" "$evidence/"
          cp "$RUNNER_TEMP/claude-materialized/source-set.json" "$evidence/"
          cp "$RUNNER_TEMP/claude-materialized/runtime-distribution.json" "$evidence/"
          cp "$RUNNER_TEMP/claude-native.json" "$evidence/"
          cp "$RUNNER_TEMP/claude-native-validated.json" "$evidence/"
          cp "$RUNNER_TEMP/claude-status.txt" "$evidence/"
          cp "$RUNNER_TEMP/claude.patch" "$evidence/"
          cp "$RUNNER_TEMP/claude-version.txt" "$evidence/"
          cp "$CLAUDE_EXECUTION_FILE" "$evidence/claude-execution.json"
          cp "$RUNNER_TEMP/result-tree.tar.gz" "$evidence/"
          python - "$evidence" <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1]); files=[]
          for p in sorted(x for x in root.iterdir() if x.is_file()):
              files.append({'path':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          manifest={
              'schema':'claude-r2-evidence-bundle/v1','runtime':'claude-code','status':'provider-execution-completed-pending-digital-worker-verification',
              'workflow_repository':os.environ['GITHUB_REPOSITORY'],'workflow_sha':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'verification_pass_claimed':False,'r2_qualified':False,'files':files,
          }
          (root/'bundle-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          tar -C "$evidence" -czf "$RUNNER_TEMP/claude-r2-evidence-${GITHUB_RUN_ID}.tar.gz" .

      - name: Attest runtime-owned evidence provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/claude-r2-evidence-${{ github.run_id }}.tar.gz

      - name: Export offline-verifiable provenance bundle
        shell: bash
        env:
          ATTESTATION_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE_PATH"
          cp "$ATTESTATION_BUNDLE_PATH" "$RUNNER_TEMP/claude-r2-evidence-${GITHUB_RUN_ID}.attestation.json"

      - name: Upload Claude R2 native evidence candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: claude-r2-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-r2-evidence-${{ github.run_id }}.tar.gz
            ${{ runner.temp }}/claude-r2-evidence-${{ github.run_id }}.attestation.json
          if-no-files-found: error
          retention-days: 30
